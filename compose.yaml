services:
  offchain-api:
    image: offchain-consumer-srv
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offchain-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env
    networks:
      - besu_besu-net
      - property-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  besu_besu-net:
    external: true
  property-network:
    external: true
